CONTINUUM_MASTER_KEY: "dev-persistent-master-key-change-in-prod"

spring:
  application:
    name: continuum
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/continuum}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:abhay123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must not touch it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # Uploads are refused by the container before a byte reaches the
      # application. UploadedInput enforces its own, lower limit as well —
      # this one exists so an oversized post is not read into memory first.
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}
  task:
    scheduling:
      # Spring's default scheduler is a single thread. Seven @Scheduled methods
      # share it — both queue pollers, the outbox dispatcher, the recovery
      # sweeper, autopilot, god mode and model discovery — so any one of them
      # running long stalled all the others, including the sweeper whose job is
      # to recover from exactly that.
      pool:
        size: ${SCHEDULER_POOL_SIZE:8}

continuum:
  engine:
    poll-interval-ms: ${ENGINE_POLL_INTERVAL_MS:500}
    batch-size: ${ENGINE_BATCH_SIZE:10}
    recovery-interval-ms: ${ENGINE_RECOVERY_INTERVAL_MS:5000}
    workflow-task-timeout-seconds: ${ENGINE_WORKFLOW_TASK_TIMEOUT:60}
    workers-enabled: ${ENGINE_WORKERS_ENABLED:true}
  llm:
    failover-order: ${LLM_FAILOVER_ORDER:gemini,groq,mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Every series carries the application name, so a shared Prometheus can
      # tell two deployments apart without relying on the scrape job's labels.
      application: continuum
    # Latency is the number this product is judged on, and an average hides
    # exactly the tail that matters. Published as a histogram so percentiles can
    # be aggregated across instances rather than averaged, which is the mistake
    # that makes a fleet-wide p99 meaningless.
    #
    # This block belongs under `management.metrics`; one level higher it binds
    # to nothing and is silently ignored, which is how it first shipped.
    distribution:
      percentiles-histogram:
        continuum.gateway.request: true
        continuum.gateway.overhead: true
      percentiles:
        continuum.gateway.request: 0.5, 0.95, 0.99
        continuum.gateway.overhead: 0.5, 0.95, 0.99
      slo:
        continuum.gateway.request: 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s

server:
  port: ${PORT:8080}

logging:
  level:
    io.continuum: INFO

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brightcart × Continuum</title>
  <meta name="description" content="A live demo: an Indian online store whose AI features all run through Continuum.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2611d'/%3E%3Cpath d='M9 11h14l-2 10H11z' fill='white'/%3E%3Ccircle cx='13' cy='24' r='1.7' fill='white'/%3E%3Ccircle cx='20' cy='24' r='1.7' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- The demo frame: says what this is, and holds the tour and presenter controls. -->
  <header class="demobar">
    <div class="demobar-title">
      <span class="pulse" aria-hidden="true"></span>
      <b>Live demo</b>
      <span class="demobar-sub">An online store whose AI runs through <b>Continuum</b></span>
    </div>
    <button class="tourpill" id="tour-open" aria-haspopup="dialog">
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle id="tour-ring" cx="18" cy="18" r="15"/></svg>
      <span><b>Feature tour</b> <span id="tour-count">0 / 36</span></span>
    </button>
    <div class="demobar-right">
      <button class="chip-btn" id="presenter-chip" aria-haspopup="dialog">
        <span class="dot" id="presenter-dot"></span><span id="presenter-label">Presenter</span>
      </button>
      <button class="chip-btn xray-toggle" id="xray-toggle" aria-pressed="true" title="Show or hide the Continuum X-ray">
        <span aria-hidden="true">◎</span> X-ray
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <!-- The store: what Brightcart's customers and staff see. -->
    <section class="appwin" id="appwin" aria-label="Brightcart store">
      <div class="chrome" aria-hidden="true">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="url"><svg viewBox="0 0 16 16"><path d="M5 7V5a3 3 0 0 1 6 0v2h1v7H4V7zm2 0h2V5a1 1 0 0 0-2 0z"/></svg><span id="url">brightcart.in</span></span>
      </div>

      <header class="storehead">
        <a class="logo" href="#shop" data-tab="shop" aria-label="Brightcart home">
          <span class="logo-mark"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path d="M9 11h14l-2 10H11z"/><circle cx="13" cy="24" r="1.7"/><circle cx="20" cy="24" r="1.7"/></svg></span>
          <span class="logo-word">bright<b>cart</b></span>
        </a>
        <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg><input id="search" placeholder="Search kurtas, cookers, diyas…" aria-label="Search the store"></label>
        <button class="deliver" id="deliver" title="Delivery location"><span>Deliver to</span><b id="deliver-to">Pune 411004</b></button>
        <div class="account">
          <button class="who" id="who" aria-haspopup="listbox"><span class="avatar" id="who-avatar">P</span><span class="who-text"><span>Hello,</span><b id="who-name">Priya</b></span></button>
          <div class="who-menu" id="who-menu" role="listbox" hidden></div>
        </div>
        <button class="cart" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span class="cart-n" id="cart-n">0</span></button>
      </header>

      <nav class="tabs" aria-label="Store areas">
        <a href="#shop" data-tab="shop" class="on">Shop</a>
        <a href="#orders" data-tab="orders">My orders</a>
        <span class="tabs-sep" aria-hidden="true"></span>
        <a href="#desk" data-tab="desk"><span class="staff">Staff</span>Support desk</a>
        <a href="#office" data-tab="office"><span class="staff">Staff</span>Back office</a>
      </nav>

      <div class="views" id="views">
        <div class="view" id="view-shop" data-view="shop"></div>
        <div class="view" id="view-orders" data-view="orders" hidden></div>
        <div class="view" id="view-desk" data-view="desk" hidden></div>
        <div class="view" id="view-office" data-view="office" hidden></div>
      </div>

      <!-- The shop assistant: floats over the store like on any real site. -->
      <button class="chat-launch" id="chat-launch" aria-label="Open the Brightcart assistant">
        <span class="chat-launch-icon">✦</span><span class="chat-launch-text">Need help?</span>
      </button>
      <section class="chat" id="chat" aria-label="Brightcart assistant" hidden></section>

      <!-- The tour's narration and results, shown over the store. -->
      <div class="director" id="director" hidden></div>
      <div class="result" id="result" hidden></div>
    </section>

    <!-- What Continuum did, per call. -->
    <aside class="xray" id="xray" aria-label="Continuum X-ray"></aside>
  </main>

  <div class="sheet-wrap" id="tour" hidden></div>
  <div class="modal-wrap" id="presenter" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

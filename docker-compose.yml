# Local one-command stack: Postgres + backend + dashboard.
#   docker compose up --build
# Then open http://localhost:8081 (dashboard) — API is on http://localhost:8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum
      POSTGRES_DB: continuum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/continuum
      SPRING_DATASOURCE_USERNAME: continuum
      SPRING_DATASOURCE_PASSWORD: continuum
      # Optional — leave blank to use the built-in mock provider:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend directly in this simple setup.
        VITE_API_BASE: "http://localhost:8080"
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:

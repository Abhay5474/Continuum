# Local one-command stack: Postgres + backend + dashboard.
#   docker compose up --build
# Then open http://localhost:8081 (dashboard) — API is on http://localhost:8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum
      POSTGRES_DB: continuum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/continuum
      SPRING_DATASOURCE_USERNAME: continuum
      SPRING_DATASOURCE_PASSWORD: continuum
      # A model provider: set either, or add a key in the console later.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Lets workflow steps, specialists and webhooks call private addresses,
      # such as an app on this machine (demo-app/README.md). Off by default.
      CONTINUUM_DECLARATIVE_ALLOW_PRIVATE_TARGETS: ${CONTINUUM_DECLARATIVE_ALLOW_PRIVATE_TARGETS:-false}
    extra_hosts:
      # host.docker.internal on Linux too, so the backend can reach the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend directly in this simple setup.
        VITE_API_BASE: "http://localhost:8080"
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:

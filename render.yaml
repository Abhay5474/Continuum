# Render Blueprint — provisions the database and the backend API in one shot.
# Deploy: push to GitHub, then "New > Blueprint" in Render and pick this repo.
# (The dashboard is intended for Vercel; see docs/DEPLOYMENT.md.)
databases:
  - name: continuum-db
    databaseName: continuum
    user: continuum
    plan: free

services:
  - type: web
    name: continuum-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # DATABASE_URL (postgres://...) is auto-translated to a JDBC URL by
      # DatabaseUrlEnvironmentPostProcessor at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: continuum-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
